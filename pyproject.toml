[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-eye"
version = "0.5.0"
description = "Procedural ASCII/ANSI eye for macOS Terminal and iTerm2"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24,<3", "Pillow>=10,<13"]

[project.optional-dependencies]
mouse = ["pyobjc-framework-Quartz>=10; sys_platform == 'darwin'"]
camera = ["opencv-contrib-python>=4.8,<5"]
all = ["pyobjc-framework-Quartz>=10; sys_platform == 'darwin'", "opencv-contrib-python>=4.8,<5"]
mediapipe = [
    "mediapipe==0.10.21; python_version < '3.13'",
    "numpy>=1.24,<2; python_version < '3.13'",
    "opencv-contrib-python>=4.8,<4.12; python_version < '3.13'",
]
dev = ["pytest>=8"]

[project.scripts]
terminal-eye = "eyeterm.cli:main"

[tool.setuptools.packages.find]
include = ["eyeterm*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
